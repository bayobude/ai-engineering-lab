[project]
name = "ai-engineering-lab"
version = "0.1.0"
description = "Iris classification API built with FastAPI and scikit-learn"
readme = "README.md"
authors = [
    { name = "BayoBude", email = "bayobude@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.5.3",
    "scikit-learn>=1.9.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
]