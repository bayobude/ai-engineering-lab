name: AI Engineering CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Run tests
        run: uv run pytest

      - name: Build Docker image
        run: docker build -t iris-classification-api .

      - name: Start Docker container
        run: |
          docker run -d \
            --name iris-classification-api \
            -p 8000:8000 \
            iris-classification-api

      - name: Wait for API health check
        run: |
          for i in {1..10}; do
            if curl --fail http://127.0.0.1:8000/api/v1/health; then
              echo "API is healthy!"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 3
          done

          echo "API failed to become healthy"
          docker logs iris-classification-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: |
          docker stop iris-classification-api || true
          docker rm iris-classification-api || true
